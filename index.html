<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>夜市撈魚｜One-Forty 中文小遊戲（骨架原型）</title>
<style>
  * { box-sizing: border-box; margin:0; padding:0; }
  html, body { height:100%; overscroll-behavior:none; }
  body {
    font-family: "PingFang TC","Microsoft JhengHei","Noto Sans TC",Arial,sans-serif;
    background: linear-gradient(180deg,#1a2a6c,#0f3460 60%,#0a1f3d);
    min-height: 100vh;
    min-height: 100dvh;
    color:#fff;
    display:flex; align-items:center; justify-content:center;
    padding: 12px;
    overflow-y:auto;
  }
  .app { width:100%; max-width:420px; max-height:100dvh; }
  .screen { position:relative; display:none; background:rgba(255,255,255,0.06); border-radius:20px; padding:18px 18px; box-shadow:0 10px 40px rgba(0,0,0,0.4); max-height:calc(100dvh - 24px); overflow-y:auto; }
  .quit-btn {
    position:absolute; top:14px; right:14px; width:28px; height:28px; border-radius:50%;
    background:rgba(255,255,255,0.15); display:flex; align-items:center; justify-content:center;
    font-size:14px; cursor:pointer; z-index:5;
  }
  .quit-btn:active { background:rgba(255,255,255,0.3); }
  .screen.active { display:block; }
  h1 { font-size:20px; text-align:center; margin-bottom:5px; }
  .sub { text-align:center; opacity:0.8; font-size:12px; margin-bottom:14px; }
  .hero-icon { text-align:center; font-size:44px; margin-bottom:10px; }
  .brand-logo { display:block; margin:0 auto 12px; width:110px; height:auto; }
  .brand-logo.small { width:90px; margin:18px auto 4px; opacity:0.9; }
  .lang-btn {
    width:100%; padding:16px; margin-bottom:12px; border:none; border-radius:14px;
    background:#FCC80E; color:#14314C; font-size:16px; font-weight:bold; cursor:pointer;
    display:flex; align-items:center; gap:10px; justify-content:center;
  }
  .lang-btn:active { transform: scale(0.97); }
  .hud { display:flex; justify-content:space-between; align-items:center; margin:0 0 8px; padding-top:32px; font-size:14px; }
  .hud .lives { color:#ff6b6b; letter-spacing:2px; }
  .hud .score { color:#FFB81C; font-weight:bold; }
  .progress { text-align:center; font-size:12px; opacity:0.7; margin-bottom:10px; }
  .speed-bonus-note { text-align:center; font-size:12px; color:#FFB81C; opacity:0.9; margin-top:-8px; margin-bottom:8px; }
  .timer { text-align:center; font-size:11px; opacity:0.75; margin-bottom:6px; color:#10C5DD; font-weight:bold; letter-spacing:1px; }
  .prompt { background:rgba(255,255,255,0.08); border-radius:14px; padding:12px; text-align:center; font-size:16px; line-height:1.4; margin-bottom:10px; min-height:44px; display:flex; align-items:center; justify-content:center; }
  .media-box { width:100%; height:88px; border-radius:14px; margin-bottom:10px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; font-size:12px; color:#1a2a6c; font-weight:bold; text-align:center; padding:6px; }
  .media-box.image { background: repeating-linear-gradient(45deg,#a8d8ff,#a8d8ff 10px,#8fc9ff 10px,#8fc9ff 20px); }
  .media-box.image.has-photo { background:#fff; padding:4px; }
  .media-box.image.has-photo img { width:100%; height:100%; object-fit:contain; border-radius:10px; }
  .media-box.audio { background:#ffe0a3; cursor:pointer; }
  .media-box.audio:active { transform: scale(0.98); }
  .speaker { font-size:36px; }
  .pond { position:relative; background:linear-gradient(180deg,#1c6ea4,#0e4d78); border-radius:16px; padding:10px 8px 8px; margin-bottom:4px; overflow:hidden; }
  .pond-fish { position:absolute; font-size:16px; opacity:0.35; animation: swim-across linear infinite; pointer-events:none; }
  @keyframes swim-across {
    0% { transform: translateX(-30px) scaleX(1); }
    49% { transform: translateX(340px) scaleX(1); }
    50% { transform: translateX(340px) scaleX(-1); }
    99% { transform: translateX(-30px) scaleX(-1); }
    100% { transform: translateX(-30px) scaleX(1); }
  }
  .options { display:grid; grid-template-columns:1fr 1fr; gap:10px; position:relative; z-index:2; }
  .opt {
    background:#ffffff; color:#1a2a6c; border:none; border-radius:40% 40% 45% 45% / 60% 60% 40% 40%;
    padding:12px 6px; font-size:15px; font-weight:bold; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:2px;
    animation: bob 2.4s ease-in-out infinite;
    box-shadow: 0 4px 10px rgba(0,0,0,0.25);
    position:relative;
  }
  .opt:nth-child(2) { animation-delay: 0.3s; }
  .opt:nth-child(3) { animation-delay: 0.6s; }
  .opt:nth-child(4) { animation-delay: 0.9s; }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
  }
  .opt .fish-icon { font-size:15px; }
  .opt .py { font-size:11px; font-weight:normal; opacity:0.65; }
  .opt.correct { background:#8fd694; animation:none; }
  .opt.wrong { background:#ff8b8b; animation:none; }
  .opt.reveal-correct { background:#8fd694; animation:none; box-shadow: 0 0 0 3px #FFB81C; }
  .opt:disabled { cursor:default; }
  .streak-toast {
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%) scale(0.7);
    background:#FFB81C; color:#14314C; font-weight:bold; font-size:14px;
    padding:10px 18px; border-radius:20px; box-shadow:0 6px 20px rgba(0,0,0,0.35);
    z-index:30; opacity:0; text-align:center; white-space:nowrap;
    animation: streak-pop 1.4s ease-out forwards;
  }
  @keyframes streak-pop {
    0% { opacity:0; transform:translate(-50%,-50%) scale(0.6); }
    15% { opacity:1; transform:translate(-50%,-50%) scale(1.08); }
    25% { transform:translate(-50%,-50%) scale(1); }
    80% { opacity:1; }
    100% { opacity:0; transform:translate(-50%,-60%) scale(0.95); }
  }
  .tutorial-hint {
    position:absolute; bottom:-6px; left:50%; transform:translateX(-50%);
    display:flex; flex-direction:column; align-items:center; gap:2px;
    z-index:20; pointer-events:none;
  }
  .tutorial-hint .hand { font-size:30px; animation: point-tap 1.1s ease-in-out infinite; }
  .tutorial-hint .hint-text {
    background:rgba(0,0,0,0.7); color:#fff; font-size:11px; padding:4px 10px; border-radius:10px; white-space:nowrap;
  }
  @keyframes point-tap {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-8px) scale(0.92); }
  }
  .net-scoop {
    position:absolute; top:50%; left:50%; font-size:30px;
    transform: translate(-50%,-50%) scale(0.4); opacity:0;
    animation: scoop 0.6s ease-out forwards; pointer-events:none; z-index:10;
  }
  @keyframes scoop {
    0% { transform: translate(-50%,-60%) scale(0.3); opacity:0; }
    40% { transform: translate(-50%,-50%) scale(1.3); opacity:1; }
    100% { transform: translate(-50%,-50%) scale(1); opacity:0; }
  }
  .footer-note { text-align:center; font-size:10px; opacity:0.5; margin-top:8px; }
  .trophy { font-size:56px; text-align:center; margin-bottom:8px; }
  .final-score { text-align:center; font-size:32px; font-weight:bold; color:#FFB81C; margin-bottom:4px; }
  .final-label { text-align:center; font-size:13px; opacity:0.8; margin-bottom:22px; }
  .cta-btn {
    width:100%; padding:16px; border:none; border-radius:14px; background:#EB615A; color:#fff;
    font-size:16px; font-weight:bold; margin-bottom:10px; cursor:pointer;
  }
  .replay-btn {
    width:100%; padding:14px; border:2px solid rgba(255,255,255,0.4); border-radius:14px; background:transparent; color:#fff;
    font-size:14px; cursor:pointer;
  }
  .lantern { text-align:center; font-size:20px; margin-bottom:4px; letter-spacing:8px; }
  .leaderboard { margin-top:16px; }
  .leaderboard-title { text-align:center; font-size:12px; opacity:0.7; margin-bottom:8px; letter-spacing:1px; }
  .leaderboard-row {
    display:flex; align-items:center; gap:8px; padding:6px 10px; border-radius:10px;
    background:rgba(255,255,255,0.06); margin-bottom:5px; font-size:13px;
  }
  .leaderboard-row .rank { width:20px; font-weight:bold; color:#FFB81C; }
  .leaderboard-row .id { flex:1; opacity:0.75; font-size:11px; }
  .leaderboard-row .time { opacity:0.7; font-size:11px; color:#10C5DD; }
  .leaderboard-row .pts { font-weight:bold; min-width:32px; text-align:right; }
  .leaderboard-row.me { background:rgba(252,200,14,0.18); border:1px solid rgba(252,200,14,0.5); }
  .my-result {
    text-align:center; font-size:12.5px; font-weight:bold; color:#14314C;
    background:#FCC80E; border-radius:10px; padding:8px 10px; margin-bottom:8px;
  }
  .back-link { text-align:center; font-size:12px; opacity:0.6; margin-top:14px; cursor:pointer; text-decoration:underline; }
  .home-btn {
    width:44px; height:44px; border-radius:50%; background:rgba(255,255,255,0.12);
    display:flex; align-items:center; justify-content:center; font-size:20px;
    margin:16px auto 0; cursor:pointer; text-decoration:none;
  }
  .home-btn:active { background:rgba(255,255,255,0.25); }
  .how-to-play { margin:4px 0 16px; }
  .how-to-play .htp-row {
    display:flex; align-items:center; gap:8px; font-size:12.5px; opacity:0.9;
    background:rgba(255,255,255,0.06); border-radius:10px; padding:8px 10px; margin-bottom:6px;
  }
  .how-to-play .htp-icon { font-size:18px; flex-shrink:0; }
</style>
</head>

      { icon: "🏆", text: "Hoàn thành 10 câu để xem điểm của bạn" },
    ],
    myResultLabel: "Kết quả của bạn",
  }
};

let state = {
  lang: null,
  pool: [],
  index: 0,
  score: 0,
  lives: 3,
  total: 10,
  startTime: null,
  timerInterval: null,
  durationSec: 0,
  correctCount: 0,
  bgmPlaying: false,
  bgmTimer: null,
  streak: 0,
};

function getDeviceId() {
  let id = localStorage.getItem('of_device_id');
  if (!id) {
    id = 'dev_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 10);
    localStorage.setItem('of_device_id', id);
  }
  return id;
}

function formatTime(sec) {
  const m = Math.floor(sec / 60).toString().padStart(2, '0');
  const s = Math.floor(sec % 60).toString().padStart(2, '0');
  return `${m}:${s}`;
}

function startTimer() {
  state.startTime = Date.now();
  if (state.timerInterval) clearInterval(state.timerInterval);
  state.timerInterval = setInterval(() => {
    const elapsed = Math.floor((Date.now() - state.startTime) / 1000);
    const timerEl = document.getElementById('timer');
    if (timerEl) timerEl.textContent = '⏱️ ' + formatTime(elapsed);
  }, 1000);
}

function stopTimer() {
  if (state.timerInterval) {
    clearInterval(state.timerInterval);
    state.timerInterval = null;
  }
  state.durationSec = state.startTime ? Math.floor((Date.now() - state.startTime) / 1000) : 0;
}

function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildPool() {
  const RECENT_KEY = 'of_recent_qids';
  const RECENT_LIMIT = 30;
  let recent = [];
  try { recent = JSON.parse(localStorage.getItem(RECENT_KEY) || '[]'); } catch (e) { recent = []; }

  // 盡量避開最近幾輪玩過的題目；題庫快被排除完時就重新開放全部
  let candidates = QUESTIONS.filter(q => !recent.includes(q.id));
  if (candidates.length < 15) candidates = QUESTIONS.slice();

  // 第一題：從候選裡選一題「簡單」難度當暖身題
  const easyCandidates = candidates.filter(q => q.difficulty === '簡單');
  const firstPool = easyCandidates.length ? easyCandidates : QUESTIONS.filter(q => q.difficulty === '簡單');
  const firstQ = shuffle(firstPool)[0];

  // 其餘 9 題：依主題分組後輪流抽，避免同主題連續出現
  const byTopic = {};
  shuffle(candidates.filter(q => q.id !== firstQ.id)).forEach(q => {
    (byTopic[q.topic] = byTopic[q.topic] || []).push(q);
  });
  let topics = shuffle(Object.keys(byTopic));

  const rest = [];
  while (rest.length < 9 && topics.length) {
    for (let i = 0; i < topics.length && rest.length < 9; i++) {
      const list = byTopic[topics[i]];
      if (list && list.length) rest.push(list.shift());
    }
    topics = topics.filter(t => byTopic[t] && byTopic[t].length);
  }

  // 保底：理論上題庫夠大不會觸發，但以防萬一補滿 9 題
  if (rest.length < 9) {
    const usedNow = new Set([firstQ.id, ...rest.map(q => q.id)]);
    const filler = shuffle(QUESTIONS.filter(q => !usedNow.has(q.id)));
    while (rest.length < 9 && filler.length) rest.push(filler.shift());
  }

  const pool = [firstQ, ...rest];

  // 記住這次玩過的題目，讓下一輪盡量避開重複
  const newRecent = [...pool.map(q => q.id), ...recent].slice(0, RECENT_LIMIT);
  try { localStorage.setItem(RECENT_KEY, JSON.stringify(newRecent)); } catch (e) {}

  return pool;
}

document.querySelectorAll('.lang-btn[data-lang]').forEach(btn => {
  btn.addEventListener('click', () => {
    playClick();
    state.lang = btn.dataset.lang;
    showIntro();
  });
});

document.getElementById('sound-toggle').addEventListener('click', toggleSound);
updateSoundIcon();

function showIntro() {
  const t = I18N[state.lang];
  document.getElementById('intro-title').textContent = t.introTitle;
  document.getElementById('intro-tagline').textContent = t.introTagline;
  document.getElementById('start-btn').textContent = t.startBtn;
  document.getElementById('how-to-play').innerHTML = t.howToPlay.map(row =>
    `<div class="htp-row"><span class="htp-icon">${row.icon}</span><span>${row.text}</span></div>`
  ).join('');
  show('screen-intro');
}

document.getElementById('start-btn').addEventListener('click', () => { playClick(); startGame(); });

function startGame() {
  state.pool = buildPool();
  state.index = 0;
  state.score = 0;
  state.lives = 3;
  state.correctCount = 0;
  state.streak = 0;
  show('screen-game');
  renderQuestion();
  startTimer();
  startBGM();
}

// ---- 音效（用 Web Audio 即時合成，不需要額外音檔）----
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) audioCtx = new AC();
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function isSoundOn() {
  return localStorage.getItem('of_sound_muted') !== '1';
}

function tone(freq, startOffset, duration, type, gainPeak) {
  const ctx = getAudioCtx();
  if (!ctx || !isSoundOn()) return;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type || 'sine';
  osc.frequency.value = freq;
  const t0 = ctx.currentTime + startOffset;
  gain.gain.setValueAtTime(0, t0);
  gain.gain.linearRampToValueAtTime(gainPeak || 0.15, t0 + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
  osc.connect(gain).connect(ctx.destination);
  osc.start(t0);
  osc.stop(t0 + duration + 0.02);
}

function playClick() { tone(520, 0, 0.08, 'square', 0.06); }
function playCorrect() { tone(660, 0, 0.14, 'sine', 0.12); tone(880, 0.1, 0.18, 'sine', 0.12); }
function playWrong() { tone(220, 0, 0.22, 'sawtooth', 0.1); }
function playWin() { [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.11, 0.18, 'sine', 0.1)); }

// ---- 背景音樂：輕快的五聲音階小旋律，即時合成、不斷循環 ----
const BGM_NOTES = [523.25, 659.25, 587.33, 783.99, 659.25, 880.00, 783.99, 659.25];
const BGM_NOTE_MS = 300;
function playBgmNote(i) {
  if (!state.bgmPlaying) return;
  tone(BGM_NOTES[i % BGM_NOTES.length], 0, 0.26, 'triangle', 0.035);
  state.bgmTimer = setTimeout(() => playBgmNote(i + 1), BGM_NOTE_MS);
}
function startBGM() {
  if (state.bgmPlaying) return;
  state.bgmPlaying = true;
  playBgmNote(0);
}
function stopBGM() {
  state.bgmPlaying = false;
  if (state.bgmTimer) { clearTimeout(state.bgmTimer); state.bgmTimer = null; }
}

function toggleSound() {
  const muted = !isSoundOn();
  localStorage.setItem('of_sound_muted', muted ? '0' : '1');
  updateSoundIcon();
  if (!muted) playClick();
}

function updateSoundIcon() {
  const btn = document.getElementById('sound-toggle');
  if (btn) btn.textContent = isSoundOn() ? '🔊' : '🔇';
}

function speak(text) {
  try {
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'zh-TW';
    utter.rate = 0.85;
    speechSynthesis.cancel();
    speechSynthesis.speak(utter);
  } catch (e) { console.warn('TTS not available', e); }
}

function renderQuestion() {
  const q = state.pool[state.index];
  const t = I18N[state.lang];
  document.getElementById('lives').textContent = '❤️'.repeat(state.lives) + '🤍'.repeat(3 - state.lives);
  document.getElementById('score').textContent = '⭐ ' + state.score;
  document.getElementById('progress').textContent = `Q${state.index + 1}/${state.total}`;
  document.getElementById('footer-note').textContent = '';

  const promptEl = document.getElementById('prompt');
  const mediaSlot = document.getElementById('media-slot');
  mediaSlot.innerHTML = '';

  if (q.qtype === '看圖選詞') {
    promptEl.textContent = t.imagePrompt;
    const box = document.createElement('div');
    box.className = 'media-box image';
    if (q.image) {
      box.classList.add('has-photo');
      const img = document.createElement('img');
      img.src = q.image;
      img.alt = '';
      box.appendChild(img);
    } else {
      box.innerHTML = '🖼️<br>（圖片佔位，之後替換）';
    }
    mediaSlot.appendChild(box);
  } else if (q.qtype === '聽音選詞') {
    promptEl.textContent = t.listenPrompt;
    const box = document.createElement('div');
    box.className = 'media-box audio';
    box.innerHTML = `<span class="speaker">🔊</span><span>${t.tapToListen}</span>`;
    box.addEventListener('click', () => speak(q.options[q.answer].zh));
    mediaSlot.appendChild(box);
    // 自動播放一次
    setTimeout(() => speak(q.options[q.answer].zh), 300);
  } else {
    promptEl.textContent = q.prompt[state.lang];
  }

  const optsEl = document.getElementById('options');
  optsEl.innerHTML = '';
  const shuffledOptions = shuffle(q.options.map((o, i) => ({ ...o, isCorrect: i === q.answer })));
  shuffledOptions.forEach(opt => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.dataset.correct = opt.isCorrect ? '1' : '0';
    b.innerHTML = `<span class="fish-icon">🐟</span><span>${opt.zh}</span><span class="py">${opt.py}</span>`;
    b.addEventListener('click', () => handleAnswer(b, opt.isCorrect, optsEl));
    optsEl.appendChild(b);
  });

  maybeShowTutorialHint(t);
}

function maybeShowTutorialHint(t) {
  const seen = localStorage.getItem('of_game_tutorial_seen');
  if (seen || state.index !== 0) return;
  const pond = document.querySelector('.pond');
  const hint = document.createElement('div');
  hint.className = 'tutorial-hint';
  hint.innerHTML = `<span class="hand">👆</span><span class="hint-text">${t.tutorialHint}</span>`;
  pond.appendChild(hint);
  const dismiss = () => {
    hint.remove();
    localStorage.setItem('of_game_tutorial_seen', '1');
  };
  document.getElementById('options').addEventListener('click', dismiss, { once: true });
  setTimeout(dismiss, 4000);
}

function handleAnswer(btn, isCorrect, optsEl) {
  const t = I18N[state.lang];
  optsEl.querySelectorAll('.opt').forEach(o => o.disabled = true);
  const net = document.createElement('span');
  net.className = 'net-scoop';
  net.textContent = '🥅';
  btn.appendChild(net);
  btn.classList.add(isCorrect ? 'correct' : 'wrong');

  let delay = 700;
  if (isCorrect) {
    state.score += 10;
    state.correctCount += 1;
    state.streak += 1;
    playCorrect();
    if (state.streak > 0 && state.streak % 3 === 0) {
      state.score += 5;
      showStreakToast(t.streakMsg);
      delay = 1500;
    }
  } else {
    state.lives -= 1;
    state.streak = 0;
    playWrong();
    // 答錯時亮出正確答案，讓玩家學到東西再進下一題
    const correctBtn = optsEl.querySelector('.opt[data-correct="1"]');
    if (correctBtn && correctBtn !== btn) correctBtn.classList.add('reveal-correct');
    delay = 1400;
  }
  document.getElementById('score').textContent = '⭐ ' + state.score;
  document.getElementById('lives').textContent = '❤️'.repeat(state.lives) + '🤍'.repeat(3 - state.lives);
  setTimeout(() => {
    if (state.lives <= 0) {
      endGame();
      return;
    }
    state.index += 1;
    if (state.index >= state.total) {
      endGame();
      return;
    }
    renderQuestion();
  }, delay);
}

function showStreakToast(msg) {
  const screen = document.getElementById('screen-game');
  const toast = document.createElement('div');
  toast.className = 'streak-toast';
  toast.textContent = msg;
  screen.appendChild(toast);
  playWin();
  setTimeout(() => toast.remove(), 1400);
}

function endGame() {
  stopTimer();
  stopBGM();
  const t = I18N[state.lang];
  const result = state.lives <= 0 ? 'lost' : 'finished';

  // 手速加分：只有 10 題都答完（沒被扣光生命）才計算，越快答完加越多分，
  // 避免「全對就一定同分」的天花板問題
  let speedBonus = 0;
  if (result === 'finished') {
    speedBonus = Math.max(0, Math.floor((120 - state.durationSec) / 2));
    state.score += speedBonus;
  }

  document.getElementById('final-score').textContent = state.score;
  document.getElementById('final-label').textContent = t.score;
  document.getElementById('speed-bonus-note').textContent = speedBonus > 0 ? `${t.speedBonusNote} +${speedBonus}` : '';
  document.getElementById('cta-btn').textContent = '📱 ' + t.cta;
  document.getElementById('replay-btn').textContent = '🔄 ' + t.replay;
  document.getElementById('leaderboard').innerHTML = '';
  show('screen-end');
  if (result === 'finished') playWin();

  submitResult({
    deviceId: getDeviceId(),
    lang: state.lang,
    score: state.score,
    correctCount: state.correctCount,
    totalAnswered: state.index + 1,
    durationSec: state.durationSec,
    result: result,
  });
  fetchLeaderboard(t);
}

function submitResult(payload) {
  if (!API_URL) return;
  // Apps Script Web App 不支援 CORS 預檢，用 text/plain 送 body 可以避開瀏覽器的 preflight 檢查
  fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload),
  }).catch(err => console.warn('送出紀錄失敗（不影響遊戲本身）', err));
}

function fetchLeaderboard(t) {
  if (!API_URL) return;
  const el = document.getElementById('leaderboard');
  const url = `${API_URL}?action=leaderboard&score=${state.score}&duration=${state.durationSec}`;
  fetch(url)
    .then(res => res.json())
    .then(json => {
      if (!json.ok) return;
      const myId = getDeviceId().slice(-6);
      const rows = (json.data || []).map((row, i) => `
        <div class="leaderboard-row ${row.deviceId === myId ? 'me' : ''}">
          <span class="rank">${i + 1}</span>
          <span class="id">${row.deviceId}</span>
          <span class="time">⏱️ ${formatTime(row.durationSec || 0)}</span>
          <span class="pts">${row.score}</span>
        </div>`).join('');

      let myResultHtml = '';
      if (json.me) {
        const inTop10 = json.me.rank <= 10;
        myResultHtml = `
          <div class="my-result">
            ${t.myResultLabel}：#${json.me.rank} / ${json.totalPlayers}
            ⭐ ${json.me.score}　⏱️ ${formatTime(json.me.durationSec)}
            ${inTop10 ? ' 🎉' : ''}
          </div>`;
      }

      el.innerHTML = rows
        ? `<div class="leaderboard-title">${t.leaderboardTitle}</div>${myResultHtml}${rows}`
        : myResultHtml;
    })
    .catch(err => console.warn('排行榜載入失敗（不影響遊戲本身）', err));
}

document.getElementById('replay-btn').addEventListener('click', () => { playClick(); startGame(); });
document.getElementById('back-link').addEventListener('click', () => show('screen-lang'));
document.getElementById('intro-back-link').addEventListener('click', () => show('screen-lang'));
document.getElementById('quit-btn').addEventListener('click', () => {
  if (confirm(I18N[state.lang].quitConfirm)) {
    stopTimer();
    stopBGM();
    show('screen-lang');
  }
});
document.getElementById('cta-btn').addEventListener('click', () => {
  alert('這裡之後串上 One-Forty App 下載連結');
});
</script>
